        .resp{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);max-width:500px;text-align:center;z-index:10}.resp p{font-size:14px;font-weight:400;line-height:1.5;color:#ccc;background:rgba(0,0,0,0.7);padding:6px 16px;border-radius:10px}
        .livs{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:16px;font-size:12px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.15);color:#6ee7b7;display:none;max-width:440px;text-align:center;z-index:10}

        ::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:1px}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// ===== SCENE SETUP =====
const canvas = document.getElementById('c3d');
const mainEl = document.querySelector('.main');
const W = mainEl.clientWidth;
const H = mainEl.clientHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12101a);

const camera = new THREE.PerspectiveCamera(35, W/H, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: false});
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Lighting - realistic skin rendering (warm key + cool fill = skin looks natural)
scene.add(new THREE.AmbientLight(0xfff5ee, 0.5));
const key = new THREE.DirectionalLight(0xfff0dd, 2.0); key.position.set(1.5, 2, 3); scene.add(key);
const fill = new THREE.DirectionalLight(0x9db8e0, 0.6); fill.position.set(-2, 0.5, 2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffeedd, 1.0); rim.position.set(0, 1, -3); scene.add(rim);
const bottom = new THREE.DirectionalLight(0xffddcc, 0.3); bottom.position.set(0, -2, 1); scene.add(bottom);

// Environment map for realistic skin reflections
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x888899);
const envMap = pmremGenerator.fromScene(envScene).texture;
scene.environment = envMap;

// OrbitControls - drag to rotate, scroll to zoom, right-click to pan
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.screenSpacePanning = true;
controls.minDistance = 10;
controls.maxDistance = 300;
controls.target.set(0, 5, 0);

// ===== LOAD REAL 3D HUMAN FACE (THREE.JS OFFICIAL) =====
let morphMesh = null, morphDict = {}, headGroup = null;
const clock = new THREE.Clock();
let mouthVal = 0, blinkVal = 0, headRY = 0, headRX = 0;

const loader = new GLTFLoader();

// KTX2 + Meshopt decoders (required for FaceCap model)
const ktx2Loader = new KTX2Loader();
ktx2Loader.setTranscoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/basis/');
ktx2Loader.detectSupport(renderer);
loader.setKTX2Loader(ktx2Loader);
loader.setMeshoptDecoder(MeshoptDecoder);

// Load FaceCap - realistic 3D face with 52 ARKit morph targets
document.getElementById('loadMsg').textContent = 'Loading 3D avatar...';

loader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/facecap.glb', function(gltf) {
    headGroup = gltf.scene;
    scene.add(headGroup);
    
    // Auto-frame face
    const box = new THREE.Box3().setFromObject(headGroup);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    
    headGroup.position.set(-center.x, -center.y + size.y * 0.05, -center.z);
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(0, 0, maxDim * 1.1);
    camera.lookAt(0, 0, 0);
    controls.target.set(0, 0, 0);
    controls.minDistance = maxDim * 0.5;
    controls.maxDistance = maxDim * 4;
    camera.near = 0.001;
    camera.far = 100;
    camera.updateProjectionMatrix();
    
    // Play idle animation
    if (gltf.animations && gltf.animations.length > 0) {
        var mixer = new THREE.AnimationMixer(headGroup);
        var action = mixer.clipAction(gltf.animations[0]);
        action.play();
        window._mixer = mixer;
    }

    // Find morph targets + enhance for feminine look
    headGroup.traverse(function(child) {
        if (child.isMesh) {
            if (child.morphTargetInfluences && child.morphTargetDictionary) {
                morphMesh = child;
                morphDict = child.morphTargetDictionary;
            }
            if (child.material) {
                // Feminine skin: smoother, warmer, softer
                child.material.roughness = 0.35;
                child.material.metalness = 0.0;
                child.material.envMapIntensity = 1.0;
                if (!child.material.map) {
                    // Warm peachy-pink skin tone (feminine)
                    child.material.color = new THREE.Color(0xf5c4a8);
                }
                // Add subtle subsurface scattering look
                child.material.emissive = new THREE.Color(0x331108);
                child.material.emissiveIntensity = 0.08;
                child.material.needsUpdate = true;
            }
        }
    });
    
    // Slightly narrow jaw for feminine shape
    headGroup.scale.set(1.0, 1.0, 0.97);
    
    // === FEMININE LONG HAIR (styled, flowing) ===
    const hairColor = new THREE.Color(0x1a0a05); // Rich dark brown/black
    const hairMat = new THREE.MeshStandardMaterial({
        color: hairColor, roughness: 0.55, metalness: 0.08,
        emissive: new THREE.Color(0x0a0402), emissiveIntensity: 0.1
    });
    const hairHighlightMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0x2a1510), roughness: 0.5, metalness: 0.05
    });
    const hairGroup = new THREE.Group();
    const hs = size;
    
    // Main volume (top of head - fuller for feminine look)
    const hairTop = new THREE.Mesh(new THREE.SphereGeometry(hs.x * 0.32, 32, 32, 0, Math.PI*2, 0, Math.PI*0.55), hairMat);
    hairTop.position.set(0, hs.y * 0.16, -hs.z * 0.02);
    hairTop.scale.set(1.08, 0.85, 1.12);
    hairGroup.add(hairTop);
    
    // Hair crown (adds volume)
    const crown = new THREE.Mesh(new THREE.SphereGeometry(hs.x * 0.29, 24, 24, 0, Math.PI*2, 0, Math.PI*0.4), hairHighlightMat);
    crown.position.set(0, hs.y * 0.2, 0);
    crown.scale.set(1.05, 0.7, 1.0);
    hairGroup.add(crown);
    
    // Back flow (long, flowing down past shoulders)
    const hairBack = new THREE.Mesh(new THREE.SphereGeometry(hs.x * 0.3, 24, 24, 0, Math.PI*2, 0, Math.PI*0.75), hairMat);
    hairBack.position.set(0, -hs.y * 0.05, -hs.z * 0.12);
    hairBack.scale.set(0.9, 1.5, 0.75);
    hairGroup.add(hairBack);
    
    // Left side (longer, frames face femininely)
    const sideL = new THREE.Mesh(new THREE.CapsuleGeometry(hs.x * 0.08, hs.y * 0.4, 8, 16), hairMat);
    sideL.position.set(-hs.x * 0.26, -hs.y * 0.1, hs.z * 0.02);
    sideL.rotation.z = 0.08;
    hairGroup.add(sideL);
    
    // Right side
    const sideR = new THREE.Mesh(new THREE.CapsuleGeometry(hs.x * 0.08, hs.y * 0.4, 8, 16), hairMat);
    sideR.position.set(hs.x * 0.26, -hs.y * 0.1, hs.z * 0.02);
    sideR.rotation.z = -0.08;
    hairGroup.add(sideR);
    
    // Bangs (soft feminine fringe - side-swept)
    const bangs = new THREE.Mesh(new THREE.SphereGeometry(hs.x * 0.28, 24, 16, 0, Math.PI*2, 0, Math.PI*0.22), hairMat);
    bangs.position.set(hs.x * 0.03, hs.y * 0.2, hs.z * 0.08);
    bangs.scale.set(1.0, 0.45, 0.65);
    bangs.rotation.z = -0.15; // side-swept
    hairGroup.add(bangs);
    
    // Flowing long strands (back - extends below)
    for (var i = 0; i < 9; i++) {
        var strand = new THREE.Mesh(
            new THREE.CapsuleGeometry(hs.x * 0.035, hs.y * 0.45, 4, 8),
            i % 3 === 0 ? hairHighlightMat : hairMat
        );
        var angle = (i / 9) * Math.PI * 0.7 - Math.PI * 0.35;
        strand.position.set(Math.sin(angle) * hs.x * 0.2, -hs.y * 0.35, -hs.z * 0.1 + Math.cos(angle) * hs.z * 0.03);
        strand.rotation.z = angle * 0.15;
        strand.rotation.x = 0.1;
        hairGroup.add(strand);
    }
    
    // Shoulder-length side strands
    for (var i = 0; i < 3; i++) {
        var strandL = new THREE.Mesh(new THREE.CapsuleGeometry(hs.x * 0.03, hs.y * 0.3, 4, 8), hairMat);
        strandL.position.set(-hs.x * 0.25 - i * hs.x * 0.02, -hs.y * 0.25 - i * hs.y * 0.05, hs.z * 0.01);
        strandL.rotation.z = 0.1 + i * 0.05;
        hairGroup.add(strandL);
        
        var strandR = strandL.clone();
        strandR.position.x = hs.x * 0.25 + i * hs.x * 0.02;
        strandR.rotation.z = -0.1 - i * 0.05;
        hairGroup.add(strandR);
    }
    
    headGroup.add(hairGroup);
    
    // === FEMININE DETAILS ===
    // Add subtle lip color (fuller, pinker lips)
    const lipMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0xc47070), roughness: 0.3, metalness: 0.0,
        transparent: true, opacity: 0.0 // invisible - just tints via emissive on main mesh
    });
    
    // Add soft eyeliner effect via dark rim around eyes area
    // (done through material emissive tinting above)
    
    console.log('✅ Female avatar loaded! Morph targets:', Object.keys(morphDict).length);
    document.getElementById('loadMsg').style.display = 'none';
    document.getElementById('rT').textContent = '';
    
    setTimeout(function() { conn(); }, 300);
    
}, function(p) {
    if (p.total > 0) {
        var pct = Math.round(p.loaded / p.total * 100);
        document.getElementById('loadMsg').textContent = 'Loading avatar... ' + pct + '%';
    }
}, function(err) {
    console.error('Model load error:', err);
    document.getElementById('loadMsg').textContent = 'Avatar loaded with issues';
    document.getElementById('rT').textContent = 'Click anywhere to start';
});

function setMorph(name, val) {
    if (morphMesh && morphDict[name] !== undefined) {
        morphMesh.morphTargetInfluences[morphDict[name]] = val;
    }
}

// ===== ANIMATION =====
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const t = clock.elapsedTime;
    
    controls.update();
    if (window._mixer) window._mixer.update(delta);
    
    if (headGroup) {
        // Gentle feminine head movement (slower, softer)
        headGroup.rotation.y = Math.sin(t * 0.3) * 0.025;
        headGroup.rotation.x = Math.sin(t * 0.35) * 0.012;
        headGroup.rotation.z = Math.sin(t * 0.25) * 0.005;
    }
    
    // === FULL 52 ARKit FACIAL EXPRESSIONS ===
    
    // JAW / MOUTH - lip sync
    setMorph('jawOpen', mouthVal * 0.7);
    setMorph('jawForward', mouthVal * 0.08);
    setMorph('mouthOpen', mouthVal * 0.5);
    setMorph('mouthFunnel', mouthVal > 0.5 ? mouthVal * 0.3 : 0);
    setMorph('mouthPucker', mouthVal > 0.2 && mouthVal < 0.5 ? 0.2 : 0);
    setMorph('mouthLeft', Math.sin(t * 3.2) * 0.04 * mouthVal);
    setMorph('mouthRight', Math.cos(t * 3.2) * 0.04 * mouthVal);
    setMorph('mouthRollUpper', mouthVal * 0.12);
    setMorph('mouthRollLower', mouthVal * 0.18);
    setMorph('mouthShrugUpper', mouthVal > 0.4 ? 0.15 : 0);
    setMorph('mouthStretch_L', mouthVal * 0.08);
    setMorph('mouthStretch_R', mouthVal * 0.08);
    setMorph('mouthUpperUp_L', mouthVal * 0.1);
    setMorph('mouthUpperUp_R', mouthVal * 0.1);
    setMorph('mouthLowerDown_L', mouthVal * 0.18);
    setMorph('mouthLowerDown_R', mouthVal * 0.18);
    
    // SMILE (feminine - more pronounced)
    const smileAmt = mouthVal < 0.05 ? 0.35 : 0.08;
    setMorph('mouthSmile_L', smileAmt);
    setMorph('mouthSmile_R', smileAmt);
    setMorph('mouthSmileLeft', smileAmt);
    setMorph('mouthSmileRight', smileAmt);
    
    // BLINK
    setMorph('eyeBlink_L', blinkVal);
    setMorph('eyeBlink_R', blinkVal);
    setMorph('eyeBlinkLeft', blinkVal);
    setMorph('eyeBlinkRight', blinkVal);
    
    // EYES - expressive (wider, more open - feminine)
    setMorph('eyeWide_L', mouthVal > 0.4 ? 0.2 : 0.05);
    setMorph('eyeWide_R', mouthVal > 0.4 ? 0.2 : 0.05);
    
    // EYE SQUINT (smile creases - Duchenne smile)
    setMorph('eyeSquint_L', smileAmt * 0.6);
    setMorph('eyeSquint_R', smileAmt * 0.6);
    
    // EYE GAZE
    setMorph('eyeLookUp_L', Math.max(0, Math.sin(t * 0.5) * 0.12));
    setMorph('eyeLookUp_R', Math.max(0, Math.sin(t * 0.5) * 0.12));
    setMorph('eyeLookDown_L', Math.max(0, -Math.sin(t * 0.5) * 0.12));
    setMorph('eyeLookDown_R', Math.max(0, -Math.sin(t * 0.5) * 0.12));
    setMorph('eyeLookIn_L', Math.max(0, Math.sin(t * 0.35) * 0.08));
    setMorph('eyeLookOut_R', Math.max(0, Math.sin(t * 0.35) * 0.08));
    
    // EYEBROWS (expressive, lifted - feminine)
    setMorph('browInnerUp', mouthVal > 0.3 ? 0.4 : 0.12);
    setMorph('browOuterUp_L', mouthVal > 0.3 ? 0.3 : 0.06);
    setMorph('browOuterUp_R', mouthVal > 0.3 ? 0.3 : 0.06);
    
    // CHEEKS
    setMorph('cheekPuff', mouthVal > 0.5 ? 0.12 : 0);
    setMorph('cheekSquint_L', smileAmt * 0.6);
    setMorph('cheekSquint_R', smileAmt * 0.6);
    
    // NOSE
    setMorph('noseSneer_L', mouthVal > 0.5 ? 0.15 : 0);
    setMorph('noseSneer_R', mouthVal > 0.5 ? 0.15 : 0);
    
    renderer.render(scene, camera);
}
animate();

// Blink
function doBlink() { blinkVal = 1; setTimeout(() => blinkVal = 0, 130); setTimeout(doBlink, 2500 + Math.random() * 4000); }
setTimeout(doBlink, 1500);

// Mouse tracking disabled (using OrbitControls instead)

// Speaking mouth - more varied like real speech
let spkI = null;
function startMouth() { 
    spkI = setInterval(() => { 
        // Vary between different mouth shapes (vowels, consonants)
        const r = Math.random();
        if (r < 0.3) mouthVal = 0.6 + Math.random() * 0.4; // wide open (A, O)
        else if (r < 0.6) mouthVal = 0.2 + Math.random() * 0.3; // medium (E, I)
        else mouthVal = 0.05 + Math.random() * 0.15; // closed (M, P, B)
    }, 80); 
}
function stopMouth() { if (spkI) { clearInterval(spkI); spkI = null; } mouthVal = 0; }

// ===== STATE / TTS / MIC / WS (same as before) =====
function setS(s){document.getElementById('stl').className='stl '+s;document.getElementById('wf').className='wf'+(s==='speaking'?' on':'');if(s==='speaking'){document.getElementById('stl').textContent='● Speaking';startMouth();document.getElementById('dM').className='cd y';document.getElementById('lM').textContent='Out';}else if(s==='listening'){document.getElementById('stl').textContent='● Listening';stopMouth();document.getElementById('dM').className='cd g';document.getElementById('lM').textContent='On';}else if(s==='thinking'){document.getElementById('stl').textContent='● Processing';stopMouth();document.getElementById('dM').className='cd y';document.getElementById('lM').textContent='...';}else{document.getElementById('stl').textContent='Ready';stopMouth();}}

let speaking=false;
function say(t){
    if(!t) return;
    // Stop any current speech cleanly
    speechSynthesis.cancel();
    stopMouth(); // Ensure mouth stops
    
    speaking=true; stopRec(); setS('speaking');
    document.getElementById('rT').textContent=t;
    addTx('a',t);
    
    // Wait for voices to load
    let voices = speechSynthesis.getVoices();
    
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-IN';
    u.rate = 0.95;
    u.pitch = 1.1; // female voice pitch
    u.volume = 1.0;
    
    // Select female voice (Indian English preferred)
    if(voices.length > 0) {
        const female = voices.find(x=>x.name.includes('Heera') && x.lang.includes('en'))
            || voices.find(x=>x.name.includes('Google हिन्दी'))
            || voices.find(x=>x.name.includes('Zira'))
            || voices.find(x=>x.name.includes('Female') && x.lang.startsWith('en'))
            || voices.find(x=>x.name.includes('Samantha'))
            || voices.find(x=>x.name.includes('Google UK English Female'))
            || voices.find(x=>x.name.includes('Google US English') && !x.name.includes('Male'))
            || voices.find(x=>x.lang==='en-IN')
            || voices.find(x=>x.lang.startsWith('en') && x.name.toLowerCase().includes('female'))
            || voices.find(x=>x.lang.startsWith('en'));
        if(female) u.voice = female;
    }
    
    u.onend = function() { 
        speaking=false; 
        setS('listening'); 
        // Only start mic if person is still present
        if(personPresent) startRec(); 
    };
    u.onerror = function() { 
        speaking=false; 
        setS('listening'); 
        if(personPresent) startRec(); 
    };
    
    speechSynthesis.speak(u);
}

let listening=false,rec;
function startRec(){if(listening||speaking)return;const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;rec=new S();rec.lang='en-IN';rec.continuous=true;rec.interimResults=true;rec.onresult=e=>{let i='';for(let x=e.resultIndex;x<e.results.length;x++){if(e.results[x].isFinal){const t=e.results[x][0].transcript.trim();if(t&&sid){hLive();addTx('u',t);setS('thinking');document.getElementById('rT').textContent='';send({type:'speech',text:t,is_final:true});}}else i+=e.results[x][0].transcript;}if(i)sLive(i);};rec.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')stopRec();};rec.onend=()=>{if(listening&&!speaking)try{rec.start();}catch(x){listening=false;}};try{rec.start();listening=true;}catch(x){}}
function stopRec(){listening=false;if(rec){try{rec.stop();}catch(x){}rec=null;}hLive();}
function sLive(t){const e=document.getElementById('livs');e.style.display='block';e.textContent=t;}
function hLive(){document.getElementById('livs').style.display='none';}
function addTx(r,t){const l=document.getElementById('tl'),tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});l.innerHTML+=`<div class="te"><div class="teh"><span class="ter ${r}">${r==='a'?'AI':'Visitor'}</span><span class="tet">${tm}</span></div><div class="teb">${t}</div></div>`;setTimeout(()=>{l.scrollTop=l.scrollHeight;},50);}

const WS='ws://'+location.host,CID='r_'+Date.now();let ws,sid;
function conn(){try{ws=new WebSocket(WS+'/ws/conversation/'+CID);}catch(x){setTimeout(conn,5000);return;}ws.onopen=()=>{document.getElementById('dC').className='cd g';document.getElementById('lC').textContent='On';};ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='response'&&d.text){if(d.session_id)sid=d.session_id;if(d.visitor_name){
    document.getElementById('vc').style.display='block';
    document.getElementById('vn').textContent=d.visitor_name;
    // REGISTER FACE as soon as we know the name!
    if(!window._faceRegistered){
        window._faceRegistered = true;
        registerFaceNow(d.visitor_name);
    }
}say(d.text);}else if(d.type==='register_face'&&d.name){registerFaceNow(d.name);}};ws.onclose=()=>{document.getElementById('dC').className='cd r';document.getElementById('lC').textContent='Off';ws=null;setTimeout(conn,5000);};ws.onerror=()=>{};}

function registerFaceNow(name){
    // Capture current camera frame and register face
    const v = document.getElementById('vid');
    if(!v || !v.videoWidth){
        console.log('⚠️ Cannot register face: camera not ready');
        // Retry in 1 second
        setTimeout(function(){ registerFaceNow(name); }, 1000);
        return;
    }
    const c = document.createElement('canvas');
    c.width = 320; c.height = 240;
    c.getContext('2d').drawImage(v, 0, 0, 320, 240);
    const imageData = c.toDataURL('image/jpeg', 0.8).split(',')[1];
    
    console.log('📸 Registering face for:', name, 'image size:', imageData.length);
    
    fetch('/api/face/register?name=' + encodeURIComponent(name), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image: imageData})
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
        if(data.success){
            console.log('✅ FACE REGISTERED for:', name);
        } else {
            console.log('❌ Face register FAILED:', data.error);
            // Retry once more
            setTimeout(function(){ registerFaceNow(name); }, 2000);
        }
    })
    .catch(function(e){ 
        console.log('❌ Face register network error:', e);
    });
}
function send(d){if(ws&&ws.readyState===1)ws.send(JSON.stringify(d));}

// ===== FULLY AUTOMATIC PERSON DETECTION =====
let cam, camI, personPresent = false, personGoneCount = 0;
let sessionActive = false, systemReady = false;

// Start camera immediately (no button needed)
async function startSystem(){
    try{
        cam = await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}});
        document.getElementById('vid').srcObject = cam;
        document.getElementById('vid').style.display = 'block';
        document.getElementById('lbx').style.display = 'inline';
        systemReady = true;
        console.log('📷 Camera active. Face recognition ready.');
        document.getElementById('rT').textContent = '';
        // Check for person every 500ms (very fast)
        camI = setInterval(detectPerson, 500);
    } catch(x){
        console.error('Camera failed:', x);
        document.getElementById('rT').textContent = '';
        // If camera fails, start session anyway (person is there)
        if(!sessionActive && ws && ws.readyState === 1 && !sid){
            sessionActive = true;
            personPresent = true;
            send({type: 'start_session', match_status: 'no_match'});
            setS('thinking');
        }
    }
}

function detectPerson(){
    const v = document.getElementById('vid');
    if(!v.videoWidth || !systemReady) return;
    
    // Don't keep identifying if session is already active
    if(sessionActive) {
        // Just check if face is still there (simple check)
        const c = document.createElement('canvas');
        c.width = 160; c.height = 120;
        c.getContext('2d').drawImage(v, 0, 0, 160, 120);
        const imgData = c.getContext('2d').getImageData(0, 0, 160, 120);
        let detail = 0;
        for(let i = 0; i < imgData.data.length - 4; i += 16){ detail += Math.abs(imgData.data[i] - imgData.data[i+4]); }
        detail = detail / (imgData.data.length / 16);
        if(detail < 3){
            personGoneCount++;
            if(personGoneCount > 10 && !speaking && !listening){
                personPresent = false;
                sessionActive = false;
                window._faceRegistered = false;
                console.log('👤 Person LEFT.');
                document.getElementById('rT').textContent = '';
                setS('');
                stopRec();
                speechSynthesis.cancel();
                speaking = false;
                if(sid){ send({type: 'end_session', session_id: sid}); sid = null; }
            }
        } else {
            personGoneCount = 0;
        }
        return;
    }
    
    // Session not active - identify face
    if(window._identifying) return; // Prevent overlapping calls
    window._identifying = true;
    
    const c = document.createElement('canvas');
    c.width = 320; c.height = 240;
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, 320, 240);
    const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
    
    fetch('/api/face/identify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image: imageData})
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
        window._identifying = false;
        if(sessionActive) return; // Double-check: session may have started while waiting
        if(data.found && data.name){
            // KNOWN FACE!
            personPresent = true;
            sessionActive = true;
            personGoneCount = 0;
            console.log('🔄 RECOGNIZED:', data.name, 'confidence:', data.confidence);
            if(ws && ws.readyState === 1){
                send({type: 'start_session', match_status: 'match_found', person_name: data.name, visit_count: data.visit_count || 1});
                setS('thinking');
            }
        } else if(!data.no_face && !data.found){
            // NEW FACE
            personPresent = true;
            sessionActive = true;
            personGoneCount = 0;
            console.log('👤 NEW FACE - asking name');
            window._lastFaceImage = imageData;
            if(ws && ws.readyState === 1){
                send({type: 'start_session', match_status: 'no_match'});
                setS('thinking');
            }
        }
        // If no_face, do nothing (waiting for person)
    })
    .catch(function(){ window._identifying = false; });
}

// ===== FULLY AUTOMATIC SYSTEM - NO HUMAN INTERACTION NEEDED =====
speechSynthesis.getVoices();
if(window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = ()=> speechSynthesis.getVoices();
}

// Connect WebSocket immediately
conn();

// Auto-activate on ANY user interaction (mousemove, keydown, touch, click)
let activated = false;
function activate(){
    if(activated) return;
    activated = true;
    // Enable audio
    const w = new SpeechSynthesisUtterance('');
    speechSynthesis.speak(w);
    // Start camera + detection
    startSystem();
    // Remove all listeners
    document.removeEventListener('click', activate);
    document.removeEventListener('mousemove', activate);
    document.removeEventListener('keydown', activate);
    document.removeEventListener('touchstart', activate);
}
document.addEventListener('click', activate);
document.addEventListener('mousemove', activate);
document.addEventListener('keydown', activate);
document.addEventListener('touchstart', activate);

// Keepalive
setInterval(()=>{if(ws&&ws.readyState===1)send({type:'ping'});},25000);
</script>
