    <style>
        *{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}

        .stl{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:14px;font-size:10px;font-weight:600;background:rgba(15,15,21,0.8);border:1px solid #1a1a25;color:#555;letter-spacing:.3px;z-index:10}.stl.speaking{color:#2563eb;border-color:rgba(37,99,235,.25)}.stl.listening{color:#10b981;border-color:rgba(16,185,129,.25)}.stl.thinking{color:#f59e0b;border-color:rgba(245,158,11,.25)}
        .resp{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);max-width:500px;text-align:center;z-index:10}.resp p{font-size:14px;font-weight:400;line-height:1.5;color:#ccc;background:rgba(0,0,0,0.7);padding:6px 16px;border-radius:10px}
        .livs{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:16px;font-size:12px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.15);color:#6ee7b7;display:none;max-width:440px;text-align:center;z-index:10}

        .lb{padding:1px 5px;border-radius:6px;font-size:7px;font-weight:700;background:#1a0000;color:#f44;border:1px solid #300;display:none}

        ::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:1px}
        .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:#444;z-index:5}

<body>
<div class="app">

<audio id="aud"></audio>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// ===== SCENE SETUP =====
const canvas = document.getElementById('c3d');
const mainEl = document.querySelector('.main');
const W = mainEl.clientWidth;
const H = mainEl.clientHeight;

const scene = new THREE.Scene();
// Soft neutral studio backdrop — reads more natural than the old purple tint
// and keeps skin tones true (less "doll"-looking).
scene.background = new THREE.Color(0x1b1e26);

const camera = new THREE.PerspectiveCamera(35, W/H, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: false});
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
// Slightly lower exposure so skin highlights don't blow out into a shiny,
// plastic "doll" look.
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Lighting — soft, balanced 3-point studio setup for natural (non-plastic)
// skin. Warm key from front-right, gentle cool fill from left to open up
// shadows, subtle rim for separation, and a faint bounce from below.
scene.add(new THREE.AmbientLight(0xfff3e8, 0.72));
const key = new THREE.DirectionalLight(0xfff2e2, 1.55); key.position.set(1.2, 1.8, 3); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd0f0, 0.85); fill.position.set(-2.2, 0.4, 2.2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe9d0, 0.7); rim.position.set(0, 1.2, -3); scene.add(rim);
const bottom = new THREE.DirectionalLight(0xffe2cf, 0.28); bottom.position.set(0, -2, 1.5); scene.add(bottom);

// Soft environment for gentle, diffuse skin reflections (lighter/greyer than
// before so the face doesn't look waxy).
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0xaab0bd);
const envMap = pmremGenerator.fromScene(envScene).texture;
scene.environment = envMap;

// OrbitControls - drag to rotate, scroll to zoom, right-click to pan
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.screenSpacePanning = true;
controls.minDistance = 10;
controls.maxDistance = 300;
controls.target.set(0, 5, 0);

// ===== LOAD REAL 3D HUMAN HEAD =====
// Primary: a higher-quality Ready Player Me head (real skin/eyes/hair textures)
// with ARKit blendshapes for lip-sync. Fallback: the original facecap.glb, so
// the live app NEVER breaks if the RPM model can't be fetched.
//
// RPM splits its ARKit blendshapes across several meshes (Wolf3D_Head,
// Wolf3D_Teeth, EyeLeft, EyeRight...), so we keep an ARRAY of morph meshes and
// apply each blendshape to every mesh that has it.
let morphMeshes = [];         // [{ mesh, dict }]
let morphNames = {};          // set of all available morph names (for logging)
let headGroup = null;
let modelKind = 'rpm';        // 'rpm' or 'facecap' (affects framing / fake hair)
const clock = new THREE.Clock();
let mouthVal = 0, blinkVal = 0, headRY = 0, headRX = 0;
let mouthSmooth = 0; // smoothed mouth value for natural lip motion

const loader = new GLTFLoader();

// KTX2 + Meshopt decoders (required for FaceCap; harmless for RPM)
const ktx2Loader = new KTX2Loader();
ktx2Loader.setTranscoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/basis/');
ktx2Loader.detectSupport(renderer);
loader.setKTX2Loader(ktx2Loader);
loader.setMeshoptDecoder(MeshoptDecoder);

// Avatar model resolution order (first that loads wins):
//   1) LOCAL file served by the backend: /static/avatar_head.glb
//      -> Best for production: no external internet needed. Your machine could
//         not resolve models.readyplayer.me (ERR_NAME_NOT_RESOLVED), so place a
//         Ready Player Me .glb (exported with ARKit morph targets) at
//         backend/static/avatar_head.glb and it will be used automatically.
//   2) The Ready Player Me CDN URL (only works if the host is reachable).
//   3) facecap.glb fallback (works from jsdelivr).
const LOCAL_HEAD_URL = '/static/avatar_head.glb';
const RPM_URL = (window.AVATAR_RPM_URL) ||
    'https://models.readyplayer.me/62ea7bc28a6d28ec134bbcce.glb?morphTargets=ARKit&lod=0';
const FACECAP_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/facecap.glb';

function collectMorphMeshes(root) {
    morphMeshes = [];
    morphNames = {};
    root.traverse(function(child) {
        if (child.isMesh) {
            if (child.morphTargetInfluences && child.morphTargetDictionary) {
                morphMeshes.push({ mesh: child, dict: child.morphTargetDictionary });
                Object.keys(child.morphTargetDictionary).forEach(function(k){ morphNames[k] = true; });
            }
        }
    });
}

function tuneMaterials(root, kind) {
    root.traverse(function(child) {
        if (child.isMesh && child.material) {
            var mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(function(m){
                var nm = (child.name || '').toLowerCase();
                // Eyes / teeth stay a bit glossy; skin is matte to avoid the
                // plastic "doll" sheen.
                var isEye = nm.indexOf('eye') !== -1;
                var isTeeth = nm.indexOf('teeth') !== -1;
                if (m.roughness !== undefined) {
                    m.roughness = isEye ? 0.25 : (isTeeth ? 0.4 : 0.72);
                }
                if (m.metalness !== undefined) m.metalness = 0.0;
                if (m.envMapIntensity !== undefined) m.envMapIntensity = isEye ? 0.7 : 0.35;
                // Only invent a skin color when the mesh has no real texture
                // (facecap fallback). RPM ships proper skin textures — keep them.
                if (!m.map && kind === 'facecap' && m.color) {
                    m.color = new THREE.Color(0xe8b78f);
                }
                m.needsUpdate = true;
            });
        }
    });
}

function frameHead(kind) {
    const box = new THREE.Box3().setFromObject(headGroup);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    if (kind === 'rpm') {
        // RPM is a half-body: focus the camera on the head (top ~28% of body).
        const headY = box.max.y - size.y * 0.14;   // approx eye/head level
        headGroup.position.set(-center.x, -center.y, -center.z);
        const target = new THREE.Vector3(0, headY - center.y, 0);
        controls.target.copy(target);
        const headSpan = size.y * 0.28;             // rough head height
        camera.position.set(0, target.y, headSpan * 3.1);
        camera.near = 0.01; camera.far = 100;
        controls.minDistance = headSpan * 1.4;
        controls.maxDistance = headSpan * 8;
    } else {
        headGroup.position.set(-center.x, -center.y + size.y * 0.05, -center.z);
        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(0, 0, maxDim * 1.1);
        controls.target.set(0, 0, 0);
        controls.minDistance = maxDim * 0.5;
        controls.maxDistance = maxDim * 4;
        camera.near = 0.001; camera.far = 100;
    }
    camera.lookAt(controls.target);
    camera.updateProjectionMatrix();
}

// Fake sculpted hair — ONLY used for the facecap fallback (RPM has real hair).
function addFakeHair(size) {
    const hairMat = new THREE.MeshStandardMaterial({color: 0x080605, roughness: 0.7, metalness: 0.05});
    const hairGroup = new THREE.Group();
    const hs = size;
    const hairTop = new THREE.Mesh(new THREE.SphereGeometry(hs.x * 0.3, 32, 32, 0, Math.PI*2, 0, Math.PI*0.55), hairMat);
    hairTop.position.set(0, hs.y * 0.15, -hs.z * 0.03); hairTop.scale.set(1.05, 0.9, 1.1); hairGroup.add(hairTop);
    const hairBack = new THREE.Mesh(new THREE.SphereGeometry(hs.x * 0.28, 24, 24, 0, Math.PI*2, 0, Math.PI*0.7), hairMat);
    hairBack.position.set(0, hs.y * 0.02, -hs.z * 0.1); hairBack.scale.set(0.95, 1.2, 0.8); hairGroup.add(hairBack);
    const sideL = new THREE.Mesh(new THREE.SphereGeometry(hs.x * 0.12, 16, 16), hairMat);
    sideL.position.set(-hs.x * 0.28, -hs.y * 0.02, -hs.z * 0.02); sideL.scale.set(0.5, 1.3, 0.7); hairGroup.add(sideL);
    const sideR = sideL.clone(); sideR.position.x = hs.x * 0.28; hairGroup.add(sideR);
    const bangs = new THREE.Mesh(new THREE.SphereGeometry(hs.x * 0.27, 24, 16, 0, Math.PI*2, 0, Math.PI*0.28), hairMat);
    bangs.position.set(0, hs.y * 0.2, hs.z * 0.06); bangs.scale.set(1.0, 0.5, 0.7); hairGroup.add(bangs);
    for (var i = 0; i < 7; i++) {
        var strand = new THREE.Mesh(new THREE.CapsuleGeometry(hs.x * 0.04, hs.y * 0.3, 4, 8), hairMat);
        var angle = (i / 7) * Math.PI * 0.8 - Math.PI * 0.4;
        strand.position.set(Math.sin(angle) * hs.x * 0.22, -hs.y * 0.2, -hs.z * 0.12);
        strand.rotation.z = angle * 0.2; hairGroup.add(strand);
    }
    headGroup.add(hairGroup);
}

function onModelLoaded(gltf, kind) {
    headGroup = gltf.scene;
    modelKind = kind;
    scene.add(headGroup);

    collectMorphMeshes(headGroup);
    tuneMaterials(headGroup, kind);
    frameHead(kind);

    // Idle animation only exists on facecap; RPM head has none by default.
    if (gltf.animations && gltf.animations.length > 0) {
        var mixer = new THREE.AnimationMixer(headGroup);
        mixer.clipAction(gltf.animations[0]).play();
        window._mixer = mixer;
    }

    if (kind === 'facecap') {
        var box = new THREE.Box3().setFromObject(headGroup);
        addFakeHair(box.getSize(new THREE.Vector3()));
    }

    var nMorphs = Object.keys(morphNames).length;
    console.log('✅ Avatar loaded (' + kind + '). Morph targets:', nMorphs, Object.keys(morphNames).slice(0, 12).join(', '));
    document.getElementById('loadMsg').style.display = 'none';
    document.getElementById('rT').textContent = '';
    // Brief on-screen confirmation of which model + how many blendshapes loaded,
    // so it's obvious whether the RPM head or the facecap fallback is showing.
    try {
        var badge = document.getElementById('modelBadge');
        if (!badge) {
            badge = document.createElement('div');
            badge.id = 'modelBadge';
            badge.style.cssText = 'position:absolute;top:56px;left:24px;z-index:20;font-size:10px;color:#6ee7b7;background:rgba(15,15,21,.7);border:1px solid #1a1a25;border-radius:10px;padding:4px 9px;font-weight:600';
            document.querySelector('.main').appendChild(badge);
        }
        badge.textContent = (kind === 'rpm' ? '● Realistic head (RPM)' : '● Fallback face') + ' · ' + nMorphs + ' blendshapes';
        setTimeout(function(){ if (badge) badge.style.display = 'none'; }, 6000);
    } catch (e) {}

    // Connect WebSocket (session starts when person detected by camera)
    setTimeout(function() { conn(); }, 300);
}

function loadFacecap() {
    document.getElementById('loadMsg').textContent = 'Loading 3D face...';
    loader.load(FACECAP_URL, function(gltf){ onModelLoaded(gltf, 'facecap'); },
        function(p){ if (p.total > 0) document.getElementById('loadMsg').textContent = 'Loading 3D avatar... ' + Math.round(p.loaded/p.total*100) + '%'; },
        function(err){
            console.error('Facecap load error:', err);
            document.getElementById('loadMsg').textContent = 'Avatar failed to load';
            document.getElementById('rT').textContent = '';
            // Even if the model fails, keep the app alive.
            setTimeout(function(){ conn(); }, 300);
        });
}

// Load order: local /static/avatar_head.glb  ->  RPM CDN  ->  facecap.
function loadRPM() {
    document.getElementById('loadMsg').textContent = 'Loading realistic 3D head...';
    loader.load(RPM_URL, function(gltf){ onModelLoaded(gltf, 'rpm'); },
        function(p){ if (p.total > 0) document.getElementById('loadMsg').textContent = 'Loading realistic head... ' + Math.round(p.loaded/p.total*100) + '%'; },
        function(err){
            console.warn('RPM CDN head failed (host unreachable?), falling back to facecap:', err);
            loadFacecap();
        });
}

// First try a locally-served model (no external internet needed).
document.getElementById('loadMsg').textContent = 'Loading realistic 3D head...';
loader.load(LOCAL_HEAD_URL, function(gltf){
        console.log('✅ Loaded local /static/avatar_head.glb');
        onModelLoaded(gltf, 'rpm');
    },
    function(p){ if (p.total > 0) document.getElementById('loadMsg').textContent = 'Loading realistic head... ' + Math.round(p.loaded/p.total*100) + '%'; },
    function(){
        // No local model present (or failed) -> try the RPM CDN, then facecap.
        console.log('No local /static/avatar_head.glb; trying RPM CDN...');
        loadRPM();
    });

function setMorph(name, val) {
    // Apply to every mesh that exposes this blendshape (RPM = multi-mesh).
    for (var i = 0; i < morphMeshes.length; i++) {
        var mm = morphMeshes[i];
        var idx = mm.dict[name];
        if (idx !== undefined) mm.mesh.morphTargetInfluences[idx] = val;
    }
}

// ===== ANIMATION =====
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const t = clock.elapsedTime;
    
    // Update controls (drag/zoom/pan)
    controls.update();
    
    // Update animation mixer (plays idle animation)
    if (window._mixer) window._mixer.update(delta);
    
    if (headGroup) {
        // Subtle, natural idle head movement (gentle look-around + tiny nod).
        // A touch more life while speaking. Kept small so it never looks robotic.
        var speakBoost = (typeof speaking !== 'undefined' && speaking) ? 1.6 : 1.0;
        headGroup.rotation.y = (Math.sin(t * 0.35) * 0.028 + Math.sin(t * 0.13) * 0.012) * speakBoost;
        headGroup.rotation.x = (Math.sin(t * 0.5) * 0.014 + Math.sin(t * 0.9) * 0.006 * (speakBoost - 1)) ;
    }

    // Smooth the raw mouth value so lips glide between shapes instead of
    // snapping — makes the lip-sync read far more natural.
    mouthSmooth += (mouthVal - mouthSmooth) * (mouthVal > mouthSmooth ? 0.55 : 0.32);
    var mv = mouthSmooth;

    // === FULL FACIAL EXPRESSIONS (all available morph targets) ===
    
    // JAW / MOUTH - smoothed, natural lip sync. Names cover BOTH facecap
    // (_L/_R) and Ready Player Me (Left/Right) ARKit conventions.
    setMorph('jawOpen', mv * 0.7);
    setMorph('jawForward', mv * 0.08);
    setMorph('mouthOpen', mv * 0.5);
    setMorph('mouthClose', mv < 0.1 ? 0.25 : 0);
    setMorph('mouthFunnel', mv > 0.5 ? mv * 0.28 : 0);
    setMorph('mouthPucker', (mv > 0.3 && mv < 0.5) ? 0.22 : 0);
    setMorph('mouthRollUpper', mv * 0.12);
    setMorph('mouthRollLower', mv * 0.16);
    setMorph('mouthShrugUpper', mv > 0.4 ? 0.16 : 0);
    setMorph('mouthShrugLower', mv > 0.4 ? 0.12 : 0);
    // Upper/lower lip raise — both naming conventions
    setMorph('mouthUpperUp_L', mv * 0.12); setMorph('mouthUpperUp_R', mv * 0.12);
    setMorph('mouthUpperUpLeft', mv * 0.12); setMorph('mouthUpperUpRight', mv * 0.12);
    setMorph('mouthLowerDown_L', mv * 0.18); setMorph('mouthLowerDown_R', mv * 0.18);
    setMorph('mouthLowerDownLeft', mv * 0.18); setMorph('mouthLowerDownRight', mv * 0.18);
    setMorph('mouthStretch_L', mv * 0.08); setMorph('mouthStretch_R', mv * 0.08);
    setMorph('mouthStretchLeft', mv * 0.08); setMorph('mouthStretchRight', mv * 0.08);
    setMorph('mouthDimple_L', mv > 0.3 ? 0.12 : 0); setMorph('mouthDimple_R', mv > 0.3 ? 0.12 : 0);
    setMorph('mouthDimpleLeft', mv > 0.3 ? 0.12 : 0); setMorph('mouthDimpleRight', mv > 0.3 ? 0.12 : 0);
    setMorph('mouthPress_L', mv < 0.1 ? 0.08 : 0); setMorph('mouthPress_R', mv < 0.1 ? 0.08 : 0);
    setMorph('mouthPressLeft', mv < 0.1 ? 0.08 : 0); setMorph('mouthPressRight', mv < 0.1 ? 0.08 : 0);

    // SMILE (gentle friendly resting smile, relaxes while speaking)
    const smileAmt = mv < 0.05 ? 0.22 : 0.05;
    setMorph('mouthSmile_L', smileAmt); setMorph('mouthSmile_R', smileAmt);
    setMorph('mouthSmileLeft', smileAmt); setMorph('mouthSmileRight', smileAmt);
    setMorph('mouthFrown_L', 0); setMorph('mouthFrown_R', 0);
    setMorph('mouthFrownLeft', 0); setMorph('mouthFrownRight', 0);

    // EYES - blink (both conventions)
    setMorph('eyeBlink_L', blinkVal); setMorph('eyeBlink_R', blinkVal);
    setMorph('eyeBlinkLeft', blinkVal); setMorph('eyeBlinkRight', blinkVal);

    // EYES - slight widen on strong syllables
    const wide = mv > 0.55 ? 0.15 : 0;
    setMorph('eyeWide_L', wide); setMorph('eyeWide_R', wide);
    setMorph('eyeWideLeft', wide); setMorph('eyeWideRight', wide);

    // EYES - squint slightly with smile
    setMorph('eyeSquint_L', smileAmt * 0.35); setMorph('eyeSquint_R', smileAmt * 0.35);
    setMorph('eyeSquintLeft', smileAmt * 0.35); setMorph('eyeSquintRight', smileAmt * 0.35);

    // EYE GAZE - subtle natural look-around
    const gU = Math.max(0, Math.sin(t * 0.6) * 0.12), gD = Math.max(0, -Math.sin(t * 0.6) * 0.12);
    setMorph('eyeLookUp_L', gU); setMorph('eyeLookUp_R', gU);
    setMorph('eyeLookUpLeft', gU); setMorph('eyeLookUpRight', gU);
    setMorph('eyeLookDown_L', gD); setMorph('eyeLookDown_R', gD);
    setMorph('eyeLookDownLeft', gD); setMorph('eyeLookDownRight', gD);
    const gIn = Math.max(0, Math.sin(t * 0.4) * 0.08), gOut = Math.max(0, -Math.sin(t * 0.4) * 0.08);
    setMorph('eyeLookIn_L', gIn); setMorph('eyeLookOut_L', gOut);
    setMorph('eyeLookInLeft', gIn); setMorph('eyeLookOutLeft', gOut);
    setMorph('eyeLookIn_R', gOut); setMorph('eyeLookOut_R', gIn);
    setMorph('eyeLookInRight', gOut); setMorph('eyeLookOutRight', gIn);

    // EYEBROWS - lightly expressive during speech
    setMorph('browInnerUp', mv > 0.3 ? 0.28 : 0.06);
    setMorph('browOuterUp_L', mv > 0.4 ? 0.22 : 0.02); setMorph('browOuterUp_R', mv > 0.4 ? 0.22 : 0.02);
    setMorph('browOuterUpLeft', mv > 0.4 ? 0.22 : 0.02); setMorph('browOuterUpRight', mv > 0.4 ? 0.22 : 0.02);
    setMorph('browDown_L', mv > 0.6 ? 0.1 : 0); setMorph('browDown_R', mv > 0.6 ? 0.1 : 0);
    setMorph('browDownLeft', mv > 0.6 ? 0.1 : 0); setMorph('browDownRight', mv > 0.6 ? 0.1 : 0);

    // CHEEKS
    setMorph('cheekPuff', mv > 0.5 ? 0.12 : 0);
    setMorph('cheekSquint_L', smileAmt * 0.5); setMorph('cheekSquint_R', smileAmt * 0.5);
    setMorph('cheekSquintLeft', smileAmt * 0.5); setMorph('cheekSquintRight', smileAmt * 0.5);

    // NOSE
    setMorph('noseSneer_L', mv > 0.5 ? 0.12 : 0); setMorph('noseSneer_R', mv > 0.5 ? 0.12 : 0);
    setMorph('noseSneerLeft', mv > 0.5 ? 0.12 : 0); setMorph('noseSneerRight', mv > 0.5 ? 0.12 : 0);

    // TONGUE (if available)
    setMorph('tongueOut', mv > 0.7 ? 0.05 : 0);

    renderer.render(scene, camera);
}
animate();

// Blink
function doBlink() { blinkVal = 1; setTimeout(() => blinkVal = 0, 130); setTimeout(doBlink, 2500 + Math.random() * 4000); }
setTimeout(doBlink, 1500);

// Mouse tracking disabled (using OrbitControls instead)

// Speaking mouth - more varied like real speech
let spkI = null;
function startMouth() { 
    spkI = setInterval(() => { 
        // Vary between different mouth shapes (vowels, consonants)
        const r = Math.random();
        if (r < 0.3) mouthVal = 0.6 + Math.random() * 0.4; // wide open (A, O)
        else if (r < 0.6) mouthVal = 0.2 + Math.random() * 0.3; // medium (E, I)
        else mouthVal = 0.05 + Math.random() * 0.15; // closed (M, P, B)
    }, 80); 
}
function stopMouth() { if (spkI) { clearInterval(spkI); spkI = null; } mouthVal = 0; }

// ===== STATE / TTS / MIC / WS (same as before) =====
function setS(s){document.getElementById('stl').className='stl '+s;document.getElementById('wf').className='wf'+(s==='speaking'?' on':'');if(s==='speaking'){document.getElementById('stl').textContent='● Speaking';startMouth();document.getElementById('dM').className='cd y';document.getElementById('lM').textContent='Out';}else if(s==='listening'){document.getElementById('stl').textContent='● Listening';stopMouth();document.getElementById('dM').className='cd g';document.getElementById('lM').textContent='On';}else if(s==='thinking'){document.getElementById('stl').textContent='● Processing';stopMouth();document.getElementById('dM').className='cd y';document.getElementById('lM').textContent='...';}else{document.getElementById('stl').textContent='Ready';stopMouth();}}

let speaking=false;

// ---- D-ID real-human avatar (optional) ----
// If the backend reports D-ID is enabled, we render each AI reply as a
// photoreal talking-human video. If anything fails, we transparently fall
// back to the 3D avatar + browser speech (sayWith3D).
let DID_ENABLED = false;
function didBadge(msg, color){
    try {
        var b = document.getElementById('didBadge');
        if (!b) {
            b = document.createElement('div');
            b.id = 'didBadge';
            b.style.cssText = 'position:absolute;top:56px;left:24px;z-index:30;font-size:10px;background:rgba(15,15,21,.8);border:1px solid #1a1a25;border-radius:10px;padding:4px 9px;font-weight:600';
            document.querySelector('.main').appendChild(b);
        }
        b.textContent = msg;
        b.style.color = color || '#6ee7b7';
    } catch(e){}
}
// Idle still image of the real-human face, shown when D-ID is enabled so the
// 3D "doll" is never displayed. Defaults to the D-ID presenter image; if a
// custom DID_SOURCE_URL is set, that image is used instead.
const DID_DEFAULT_IDLE = 'https://create-images-results.d-id.com/DefaultPresenters/Amy_f/image.jpeg';
let DID_IDLE_IMG = DID_DEFAULT_IDLE;

function showDIDIdle(){
    // Hide the 3D canvas, show a still real-human image so the face is present
    // immediately and between turns (no 3D doll, no blank screen).
    try {
        document.getElementById('c3d').style.display = 'none';
        document.getElementById('loadMsg').style.display = 'none';
        var img = document.getElementById('didIdle');
        if (!img) {
            img = document.createElement('img');
            img.id = 'didIdle';
            img.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:5;background:#000';
            document.querySelector('.av-wrap').appendChild(img);
        }
        img.src = DID_IDLE_IMG;
        img.style.display = 'block';
    } catch(e){}
}

fetch('/api/did/status').then(r=>r.json()).then(d=>{
    DID_ENABLED = !!(d && d.enabled);
    console.log('D-ID status:', d);
    if (DID_ENABLED) {
        // Use the configured custom face as the idle image if provided.
        if (d.has_source && d.source_url && d.source_url.indexOf('http') === 0) {
            DID_IDLE_IMG = d.source_url;
        }
        didBadge('● Real-human avatar (D-ID) ON', '#6ee7b7');
        showDIDIdle();
    } else {
        didBadge('● D-ID OFF — using 3D avatar (set DID_API_KEY)', '#fbbf24');
    }
}).catch(function(){ didBadge('● D-ID status check failed — using 3D', '#f87171'); });

function finishSpeaking(){
    speaking = false;
    setS('listening');
    if (personPresent) startRec();
}

function say(t){
    if(!t) return;
    // Always show the text + transcript immediately.
    document.getElementById('rT').textContent = t;
    addTx('a', t);

    if (DID_ENABLED) {
        sayWithDID(t);
    } else {
        sayWith3D(t);
    }
}

function sayWithDID(t){
    // Stop any 3D speech/mouth so the two paths never overlap.
    try { speechSynthesis.cancel(); } catch(e){}
    stopMouth();
    speaking = true; stopRec(); setS('speaking');

    fetch('/api/did/speak', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text: t })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
        if (data && data.success && data.video_url) {
            const vid = document.getElementById('didVid');
            vid.src = data.video_url;
            vid.classList.add('on');   // video sits above the idle image (z-index)
            vid.muted = false;
            vid.play().then(function(){
                // Real human video is playing (own audio + lip-sync).
            }).catch(function(){
                // Autoplay with sound blocked -> fall back to 3D voice.
                vid.classList.remove('on');
                sayWith3D(t);
            });
            // When the reply finishes, hide the video and show the idle
            // real-human still image again (never revert to the 3D avatar).
            vid.onended = function(){ vid.classList.remove('on'); showDIDIdle(); finishSpeaking(); };
            vid.onerror = function(){ vid.classList.remove('on'); showDIDIdle(); sayWith3D(t); };
        } else {
            // D-ID failed to generate -> show reason + fall back to 3D avatar.
            console.warn('D-ID speak failed:', data && data.reason);
            didBadge('● D-ID failed: ' + ((data && data.reason) || 'unknown') + ' — using 3D', '#f87171');
            sayWith3D(t);
        }
    })
    .catch(function(e){ console.warn('D-ID request error:', e); sayWith3D(t); });
}

function sayWith3D(t){
    if(!t) return;
    // Stop any current speech cleanly
    speechSynthesis.cancel();
    stopMouth(); // Ensure mouth stops
    
    speaking=true; stopRec(); setS('speaking');
    
    // Wait for voices to load
    let voices = speechSynthesis.getVoices();
    
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US';
    u.rate = 0.95;
    u.pitch = 0.8; // male deep voice
    u.volume = 1.0;
    
    // Select male voice
    if(voices.length > 0) {
        const male = voices.find(x=>x.name.includes('David'))
            || voices.find(x=>x.name.includes('Male'))
            || voices.find(x=>x.name.includes('Mark'))
            || voices.find(x=>x.name.includes('James'))
            || voices.find(x=>x.name.includes('Google UK English Male'))
            || voices.find(x=>x.lang==='en-US' && x.name.includes('English'))
            || voices.find(x=>x.lang.startsWith('en'));
        if(male) u.voice = male;
    }
    
    u.onend = function() { finishSpeaking(); };
    u.onerror = function() { finishSpeaking(); };
    
    speechSynthesis.speak(u);
}

let listening=false,rec;
function startRec(){if(listening||speaking)return;const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;rec=new S();rec.lang='en-IN';rec.continuous=true;rec.interimResults=true;rec.onresult=e=>{let i='';for(let x=e.resultIndex;x<e.results.length;x++){if(e.results[x].isFinal){const t=e.results[x][0].transcript.trim();if(t&&sid){hLive();addTx('u',t);setS('thinking');document.getElementById('rT').textContent='';send({type:'speech',text:t,is_final:true});}}else i+=e.results[x][0].transcript;}if(i)sLive(i);};rec.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')stopRec();};rec.onend=()=>{if(listening&&!speaking)try{rec.start();}catch(x){listening=false;}};try{rec.start();listening=true;}catch(x){}}
function stopRec(){listening=false;if(rec){try{rec.stop();}catch(x){}rec=null;}hLive();}
function sLive(t){const e=document.getElementById('livs');e.style.display='block';e.textContent=t;}
function hLive(){document.getElementById('livs').style.display='none';}
function addTx(r,t){const l=document.getElementById('tl'),tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});l.innerHTML+=`<div class="te"><div class="teh"><span class="ter ${r}">${r==='a'?'AI':'Visitor'}</span><span class="tet">${tm}</span></div><div class="teb">${t}</div></div>`;setTimeout(()=>{l.scrollTop=l.scrollHeight;},50);}

const WS='ws://'+location.host,CID='r_'+Date.now();let ws,sid;
function conn(){try{ws=new WebSocket(WS+'/ws/conversation/'+CID);}catch(x){setTimeout(conn,5000);return;}ws.onopen=()=>{document.getElementById('dC').className='cd g';document.getElementById('lC').textContent='On';};ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='response'&&d.text){if(d.session_id)sid=d.session_id;if(d.visitor_name){
    document.getElementById('vc').style.display='block';
    document.getElementById('vn').textContent=d.visitor_name;
    // REGISTER FACE as soon as we know the name!
    if(!window._faceRegistered){
        window._faceRegistered = true;
        registerFaceNow(d.visitor_name);
    }
}say(d.text);}else if(d.type==='register_face'&&d.name){registerFaceNow(d.name);}};ws.onclose=()=>{document.getElementById('dC').className='cd r';document.getElementById('lC').textContent='Off';ws=null;setTimeout(conn,5000);};ws.onerror=()=>{};}

function registerFaceNow(name){
    // Capture current camera frame and register face
    const v = document.getElementById('vid');
    if(!v || !v.videoWidth){
        console.log('⚠️ Cannot register face: camera not ready');
        // Retry in 1 second
        setTimeout(function(){ registerFaceNow(name); }, 1000);
        return;
    }
    const c = document.createElement('canvas');
    c.width = 320; c.height = 240;
    c.getContext('2d').drawImage(v, 0, 0, 320, 240);
    const imageData = c.toDataURL('image/jpeg', 0.8).split(',')[1];
    
    console.log('📸 Registering face for:', name, 'image size:', imageData.length);
    
    fetch('/api/face/register?name=' + encodeURIComponent(name), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image: imageData})
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
        if(data.success){
            console.log('✅ FACE REGISTERED for:', name);
        } else {
            console.log('❌ Face register FAILED:', data.error);
            // Retry once more
            setTimeout(function(){ registerFaceNow(name); }, 2000);
        }
    })
    .catch(function(e){ 
        console.log('❌ Face register network error:', e);
    });
}
function send(d){if(ws&&ws.readyState===1)ws.send(JSON.stringify(d));}

// ===== FULLY AUTOMATIC PERSON DETECTION =====
let cam, camI, personPresent = false, personGoneCount = 0;
let sessionActive = false, systemReady = false;

// Start camera immediately (no button needed)
async function startSystem(){
    try{
        cam = await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}});
        document.getElementById('vid').srcObject = cam;
        document.getElementById('vid').style.display = 'block';
        document.getElementById('lbx').style.display = 'inline';
        systemReady = true;
        console.log('📷 Camera active. Face recognition ready.');
        document.getElementById('rT').textContent = '';
        // Check for person every 500ms (very fast)
        camI = setInterval(detectPerson, 500);
    } catch(x){
        console.error('Camera failed:', x);
        document.getElementById('rT').textContent = '';
        // If camera fails, start session anyway (person is there)
        if(!sessionActive && ws && ws.readyState === 1 && !sid){
            sessionActive = true;
            personPresent = true;
            send({type: 'start_session', match_status: 'no_match'});
            setS('thinking');
        }
    }
}

function detectPerson(){
    const v = document.getElementById('vid');
    if(!v.videoWidth || !systemReady) return;
    
    // Don't keep identifying if session is already active
    if(sessionActive) {
        // Just check if face is still there (simple check)
        const c = document.createElement('canvas');
        c.width = 160; c.height = 120;
        c.getContext('2d').drawImage(v, 0, 0, 160, 120);
        const imgData = c.getContext('2d').getImageData(0, 0, 160, 120);
        let detail = 0;
        for(let i = 0; i < imgData.data.length - 4; i += 16){ detail += Math.abs(imgData.data[i] - imgData.data[i+4]); }
        detail = detail / (imgData.data.length / 16);
        if(detail < 3){
            personGoneCount++;
            if(personGoneCount > 10 && !speaking && !listening){
                personPresent = false;
                sessionActive = false;
                window._faceRegistered = false;
                console.log('👤 Person LEFT.');
                document.getElementById('rT').textContent = '';
                setS('');
                stopRec();
                speechSynthesis.cancel();
                speaking = false;
                if(sid){ send({type: 'end_session', session_id: sid}); sid = null; }
            }
        } else {
            personGoneCount = 0;
        }
        return;
    }
    
    // Session not active - identify face
    if(window._identifying) return; // Prevent overlapping calls
    window._identifying = true;
    
    const c = document.createElement('canvas');
    c.width = 320; c.height = 240;
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, 320, 240);
    const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
    
    fetch('/api/face/identify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image: imageData})
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
        window._identifying = false;
        if(sessionActive) return; // Double-check: session may have started while waiting
        if(data.found && data.name){
            // KNOWN FACE!
            personPresent = true;
            sessionActive = true;
            personGoneCount = 0;
            console.log('🔄 RECOGNIZED:', data.name, 'confidence:', data.confidence);
            if(ws && ws.readyState === 1){
                send({type: 'start_session', match_status: 'match_found', person_name: data.name, visit_count: data.visit_count || 1});
                setS('thinking');
            }
        } else if(!data.no_face && !data.found){
            // NEW FACE
            personPresent = true;
            sessionActive = true;
            personGoneCount = 0;
            console.log('👤 NEW FACE - asking name');
            window._lastFaceImage = imageData;
            if(ws && ws.readyState === 1){
                send({type: 'start_session', match_status: 'no_match'});
                setS('thinking');
            }
        }
        // If no_face, do nothing (waiting for person)
    })
    .catch(function(){ window._identifying = false; });
}

// ===== FULLY AUTOMATIC SYSTEM - NO HUMAN INTERACTION NEEDED =====
speechSynthesis.getVoices();
if(window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = ()=> speechSynthesis.getVoices();
}

// Connect WebSocket immediately
conn();

// Auto-activate on ANY user interaction (mousemove, keydown, touch, click)
let activated = false;
function activate(){
    if(activated) return;
    activated = true;
    // Enable audio
    const w = new SpeechSynthesisUtterance('');
    speechSynthesis.speak(w);
    // Start camera + detection
    startSystem();
    // Remove all listeners
    document.removeEventListener('click', activate);
    document.removeEventListener('mousemove', activate);
    document.removeEventListener('keydown', activate);
    document.removeEventListener('touchstart', activate);
}
document.addEventListener('click', activate);
document.addEventListener('mousemove', activate);
document.addEventListener('keydown', activate);
document.addEventListener('touchstart', activate);

// Keepalive
setInterval(()=>{if(ws&&ws.readyState===1)send({type:'ping'});},25000);
</script>
