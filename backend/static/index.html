<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Origin.AI — Intelligent Reception</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
        body{font-family:'Inter',sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased}
        .app{display:grid;grid-template-columns:1fr 340px;height:100vh}
        .main{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000}
        .hdr{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;z-index:10}
        .logo{display:flex;align-items:center;gap:8px}.logo-i{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}.logo-t{font-size:14px;font-weight:700}.logo-s{font-size:8px;color:#555;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-top:1px}
        .chips{display:flex;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:12px;background:#0f0f15;border:1px solid #1a1a25;font-size:9px;color:#666}.cd{width:5px;height:5px;border-radius:50%}.cd.g{background:#0f0;box-shadow:0 0 4px #0f0}.cd.r{background:#f00}.cd.y{background:#fa0;animation:bl 1.5s infinite}@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
        .av-wrap{width:100%;height:100%;position:absolute;top:0;left:0}
        .glow{position:absolute;inset:-4px;border-radius:20px;border:2px solid transparent;transition:all .6s;pointer-events:none}.glow.speaking{border-color:#2563eb;box-shadow:0 0 40px rgba(37,99,235,.15)}.glow.listening{border-color:#10b981;box-shadow:0 0 40px rgba(16,185,129,.12)}.glow.thinking{border-color:#f59e0b;box-shadow:0 0 40px rgba(245,158,11,.12)}
        .wf{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:flex-end;height:24px;opacity:0;transition:opacity .3s}.wf.on{opacity:1}.wvb{width:3px;border-radius:2px;background:#2563eb;animation:wva .4s ease-in-out infinite alternate}.wvb:nth-child(1){height:5px;animation-delay:0s}.wvb:nth-child(2){height:12px;animation-delay:.06s}.wvb:nth-child(3){height:18px;animation-delay:.12s}.wvb:nth-child(4){height:12px;animation-delay:.06s}.wvb:nth-child(5){height:5px;animation-delay:0s}@keyframes wva{to{height:3px}}
        .stl{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:14px;font-size:10px;font-weight:600;background:rgba(15,15,21,0.8);border:1px solid #1a1a25;color:#555;letter-spacing:.3px;z-index:10}.stl.speaking{color:#2563eb;border-color:rgba(37,99,235,.25)}.stl.listening{color:#10b981;border-color:rgba(16,185,129,.25)}.stl.thinking{color:#f59e0b;border-color:rgba(245,158,11,.25)}
        .resp{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);max-width:500px;text-align:center;z-index:10}.resp p{font-size:14px;font-weight:400;line-height:1.5;color:#ccc;background:rgba(0,0,0,0.7);padding:6px 16px;border-radius:10px}
        .livs{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:16px;font-size:12px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.15);color:#6ee7b7;display:none;max-width:440px;text-align:center;z-index:10}
        .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:#666;z-index:10}
        .panel{background:#050508;border-left:1px solid #111;display:flex;flex-direction:column}
        .ph{padding:10px 14px;border-bottom:1px solid #111;font-size:9px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;justify-content:space-between}
        .lb{padding:1px 5px;border-radius:6px;font-size:7px;font-weight:700;background:#1a0000;color:#f44;border:1px solid #300;display:none}
        .camb{height:200px;background:#000;position:relative;display:flex;align-items:center;justify-content:center}.camb video{width:100%;height:100%;object-fit:cover}
        .vc{padding:8px 12px;display:none}.vci{background:#0a0a0f;border:1px solid #151520;border-radius:6px;padding:8px 12px}.vcn{font-size:12px;font-weight:600}.vcx{font-size:9px;color:#444;margin-top:1px}
        .tls{flex:1;display:flex;flex-direction:column;overflow:hidden;border-top:1px solid #111}.tl{flex:1;overflow-y:scroll;padding:8px 10px;max-height:calc(100vh - 280px)}
        .te{margin-bottom:8px}.teh{display:flex;gap:4px;align-items:center;margin-bottom:1px}.ter{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}.ter.a{color:#2563eb}.ter.u{color:#10b981}.tet{font-size:7px;color:#2a2a2a}.teb{font-size:10px;color:#666;line-height:1.5}
        ::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:1px}
        .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:#444;z-index:5}
        /* ===== Photoreal receptionist avatar (Option 3) ===== */
        .photo-stage{width:100%;height:100%;position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#2a2410 0%,#14120a 55%,#0b0a06 100%)}
        .photo-inner{position:relative;width:100%;height:100%}
        #avatarImg{width:100%;height:100%;object-fit:cover;object-position:center 22%;transform-origin:50% 42%;animation:photoSway 7s ease-in-out infinite;will-change:transform;user-select:none}
        .photo-stage.speaking #avatarImg{animation:photoSway 4.5s ease-in-out infinite}
        @keyframes photoSway{0%,100%{transform:rotate(-0.7deg) translate(-2px,0) scale(1.02)}50%{transform:rotate(0.8deg) translate(2px,-3px) scale(1.03)}}
        /* Blink eyelids (tuned to receptionist.jpeg: eyes ~34% top, at 44%/53% width) */
        .eyelid{position:absolute;top:34%;width:6%;height:2.6%;border-radius:50%;background:linear-gradient(#e7c6a6,#d3ab84);filter:blur(1.4px);opacity:0;transition:opacity 60ms ease-in-out;pointer-events:none}
        .eyelid.l{left:44%}.eyelid.r{left:53%}
        /* Mouth overlay (mouth ~50% top, centered) */
        .mouth{position:absolute;top:50%;left:50%;width:7%;height:5%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(60,20,22,0.95) 0%,rgba(90,35,38,0.85) 55%,rgba(120,60,60,0) 100%);transform-origin:center center;transform:translate(-50%,-50%) scaleY(0.15);opacity:0;transition:opacity 80ms linear;pointer-events:none}
        .mouth-shadow{position:absolute;top:53%;left:50%;width:9%;height:2.5%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 100%);opacity:0;transition:opacity 80ms linear;pointer-events:none}
    </style>
</head>
<body>
<div class="app">
    <div class="main">
        <div class="hdr">
            <div class="logo"><div class="logo-i">CO</div><div><div class="logo-t">Code Origin.AI</div><div class="logo-s">Intelligent Reception</div></div></div>
            <div class="chips"><div class="chip"><div class="cd g"></div>AI</div><div class="chip"><div class="cd" id="dM"></div><span id="lM">—</span></div><div class="chip"><div class="cd" id="dC"></div><span id="lC">...</span></div></div>
        </div>
        <div class="av-wrap"><div class="loading" id="loadMsg" style="display:none"></div><div class="photo-stage" id="photoStage"><div class="photo-inner"><img id="avatarImg" src="/static/receptionist.jpeg" alt="AI Receptionist" draggable="false"><div class="eyelid l" id="eyeL"></div><div class="eyelid r" id="eyeR"></div><div class="mouth" id="mouth"></div><div class="mouth-shadow" id="mouthShadow"></div></div></div><div class="wf" id="wf"><div class="wvb"></div><div class="wvb"></div><div class="wvb"></div><div class="wvb"></div><div class="wvb"></div></div></div>
        <div class="stl" id="stl">Click anywhere to start</div>
        <div class="resp"><p id="rT">Click anywhere on screen to activate voice</p></div>
        <div class="livs" id="livs"></div>
    </div>
    <div class="panel">
        <div class="ph">Entrance Monitor <span class="lb" id="lbx">● LIVE</span></div>
        <div class="camb"><video id="vid" autoplay muted playsinline></video><div class="camph" id="cph" style="display:none"></div></div>
        <div class="vc" id="vc"><div class="vci"><div class="vcn" id="vn">—</div><div class="vcx">Visitor</div></div></div>
        <div class="tls"><div class="ph">Transcript</div><div class="tl" id="tl"></div></div>
    </div>
</div>
<audio id="aud"></audio>
<script>
// ============================================================
// Photoreal receptionist avatar (Option 3)
// The 3D Three.js face was replaced with a real portrait photo
// (/static/receptionist.jpeg) plus lightweight CSS overlay animation.
// mouthVal / blinkVal are still driven by the SAME startMouth()/stopMouth()
// and doBlink() functions below, so all working logic is unchanged.
// ============================================================
let mouthVal = 0, blinkVal = 0, mouthShown = 0;
const _img = document.getElementById('avatarImg');
const _mouth = document.getElementById('mouth');
const _mouthShadow = document.getElementById('mouthShadow');
const _eyeL = document.getElementById('eyeL');
const _eyeR = document.getElementById('eyeR');

// If the portrait fails to load, keep the app fully functional (no broken UI).
if (_img) {
    _img.onerror = function(){
        // Try a couple of alternate filenames, then give a neutral background.
        const alts = ['/static/receptionist.jpg','/static/receptionist.png','/static/receptionist.webp'];
        const next = alts.find(function(u){ return !_img.src.endsWith(u); });
        if (next) { _img.src = next; }
        else { _img.style.display = 'none'; }
    };
}

function animate(){
    requestAnimationFrame(animate);
    // Smooth the mouth so it doesn't jitter.
    mouthShown += (mouthVal - mouthShown) * (mouthVal > mouthShown ? 0.5 : 0.3);
    if (_mouth) {
        _mouth.style.transform = 'translate(-50%,-50%) scaleY(' + (0.15 + mouthShown * 1.0).toFixed(3) + ')';
        _mouth.style.opacity = mouthShown > 0.06 ? 0.78 : 0;
    }
    if (_mouthShadow) { _mouthShadow.style.opacity = (mouthShown * 0.5).toFixed(3); }
    if (_eyeL) { _eyeL.style.opacity = blinkVal; }
    if (_eyeR) { _eyeR.style.opacity = blinkVal; }
}
animate();

// Blink
function doBlink() { blinkVal = 1; setTimeout(() => blinkVal = 0, 130); setTimeout(doBlink, 2500 + Math.random() * 4000); }
setTimeout(doBlink, 1500);

// Start the conversation WebSocket shortly after load (previously done in the
// 3D model's onLoad callback).
setTimeout(function(){ if (typeof conn === 'function') conn(); }, 300);

// Speaking mouth - more varied like real speech
let spkI = null;
function startMouth() { 
    spkI = setInterval(() => { 
        // Vary between different mouth shapes (vowels, consonants)
        const r = Math.random();
        if (r < 0.3) mouthVal = 0.6 + Math.random() * 0.4; // wide open (A, O)
        else if (r < 0.6) mouthVal = 0.2 + Math.random() * 0.3; // medium (E, I)
        else mouthVal = 0.05 + Math.random() * 0.15; // closed (M, P, B)
    }, 80); 
}
function stopMouth() { if (spkI) { clearInterval(spkI); spkI = null; } mouthVal = 0; }

// ===== STATE / TTS / MIC / WS (same as before) =====
function setS(s){document.getElementById('stl').className='stl '+s;document.getElementById('wf').className='wf'+(s==='speaking'?' on':'');if(s==='speaking'){document.getElementById('stl').textContent='● Speaking';startMouth();document.getElementById('dM').className='cd y';document.getElementById('lM').textContent='Out';}else if(s==='listening'){document.getElementById('stl').textContent='● Listening';stopMouth();document.getElementById('dM').className='cd g';document.getElementById('lM').textContent='On';}else if(s==='thinking'){document.getElementById('stl').textContent='● Processing';stopMouth();document.getElementById('dM').className='cd y';document.getElementById('lM').textContent='...';}else{document.getElementById('stl').textContent='Ready';stopMouth();}}

let speaking=false;
function say(t){
    if(!t) return;
    // Stop any current speech cleanly
    speechSynthesis.cancel();
    stopMouth(); // Ensure mouth stops
    
    speaking=true; stopRec(); setS('speaking');
    document.getElementById('rT').textContent=t;
    addTx('a',t);
    
    // Wait for voices to load
    let voices = speechSynthesis.getVoices();
    
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US';
    u.rate = 0.95;
    u.pitch = 0.8; // male deep voice
    u.volume = 1.0;
    
    // Select male voice
    if(voices.length > 0) {
        const male = voices.find(x=>x.name.includes('David'))
            || voices.find(x=>x.name.includes('Male'))
            || voices.find(x=>x.name.includes('Mark'))
            || voices.find(x=>x.name.includes('James'))
            || voices.find(x=>x.name.includes('Google UK English Male'))
            || voices.find(x=>x.lang==='en-US' && x.name.includes('English'))
            || voices.find(x=>x.lang.startsWith('en'));
        if(male) u.voice = male;
    }
    
    u.onend = function() { 
        speaking=false; 
        setS('listening'); 
        // Only start mic if person is still present
        if(personPresent) startRec(); 
    };
    u.onerror = function() { 
        speaking=false; 
        setS('listening'); 
        if(personPresent) startRec(); 
    };
    
    speechSynthesis.speak(u);
}

let listening=false,rec;
function startRec(){if(listening||speaking)return;const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;rec=new S();rec.lang='en-IN';rec.continuous=true;rec.interimResults=true;rec.onresult=e=>{let i='';for(let x=e.resultIndex;x<e.results.length;x++){if(e.results[x].isFinal){const t=e.results[x][0].transcript.trim();if(t&&sid){hLive();addTx('u',t);setS('thinking');document.getElementById('rT').textContent='';send({type:'speech',text:t,is_final:true});}}else i+=e.results[x][0].transcript;}if(i)sLive(i);};rec.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')stopRec();};rec.onend=()=>{if(listening&&!speaking)try{rec.start();}catch(x){listening=false;}};try{rec.start();listening=true;}catch(x){}}
function stopRec(){listening=false;if(rec){try{rec.stop();}catch(x){}rec=null;}hLive();}
function sLive(t){const e=document.getElementById('livs');e.style.display='block';e.textContent=t;}
function hLive(){document.getElementById('livs').style.display='none';}
function addTx(r,t){const l=document.getElementById('tl'),tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});l.innerHTML+=`<div class="te"><div class="teh"><span class="ter ${r}">${r==='a'?'AI':'Visitor'}</span><span class="tet">${tm}</span></div><div class="teb">${t}</div></div>`;setTimeout(()=>{l.scrollTop=l.scrollHeight;},50);}

const WS='ws://'+location.host,CID='r_'+Date.now();let ws,sid;
function conn(){try{ws=new WebSocket(WS+'/ws/conversation/'+CID);}catch(x){setTimeout(conn,5000);return;}ws.onopen=()=>{document.getElementById('dC').className='cd g';document.getElementById('lC').textContent='On';};ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='response'&&d.text){if(d.session_id)sid=d.session_id;if(d.visitor_name){
    document.getElementById('vc').style.display='block';
    document.getElementById('vn').textContent=d.visitor_name;
    // REGISTER FACE as soon as we know the name!
    if(!window._faceRegistered){
        window._faceRegistered = true;
        registerFaceNow(d.visitor_name);
    }
}say(d.text);}else if(d.type==='register_face'&&d.name){registerFaceNow(d.name);}};ws.onclose=()=>{document.getElementById('dC').className='cd r';document.getElementById('lC').textContent='Off';ws=null;setTimeout(conn,5000);};ws.onerror=()=>{};}

function registerFaceNow(name){
    // Capture current camera frame and register face
    const v = document.getElementById('vid');
    if(!v || !v.videoWidth){
        console.log('⚠️ Cannot register face: camera not ready');
        // Retry in 1 second
        setTimeout(function(){ registerFaceNow(name); }, 1000);
        return;
    }
    const c = document.createElement('canvas');
    c.width = 320; c.height = 240;
    c.getContext('2d').drawImage(v, 0, 0, 320, 240);
    const imageData = c.toDataURL('image/jpeg', 0.8).split(',')[1];
    
    console.log('📸 Registering face for:', name, 'image size:', imageData.length);
    
    fetch('/api/face/register?name=' + encodeURIComponent(name), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image: imageData})
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
        if(data.success){
            console.log('✅ FACE REGISTERED for:', name);
        } else {
            console.log('❌ Face register FAILED:', data.error);
            // Retry once more
            setTimeout(function(){ registerFaceNow(name); }, 2000);
        }
    })
    .catch(function(e){ 
        console.log('❌ Face register network error:', e);
    });
}
function send(d){if(ws&&ws.readyState===1)ws.send(JSON.stringify(d));}

// ===== FULLY AUTOMATIC PERSON DETECTION =====
let cam, camI, personPresent = false, personGoneCount = 0;
let sessionActive = false, systemReady = false;

// Start camera immediately (no button needed)
async function startSystem(){
    try{
        cam = await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}});
        document.getElementById('vid').srcObject = cam;
        document.getElementById('vid').style.display = 'block';
        document.getElementById('lbx').style.display = 'inline';
        systemReady = true;
        console.log('📷 Camera active. Face recognition ready.');
        document.getElementById('rT').textContent = '';
        // Check for person every 500ms (very fast)
        camI = setInterval(detectPerson, 500);
    } catch(x){
        console.error('Camera failed:', x);
        document.getElementById('rT').textContent = '';
        // If camera fails, start session anyway (person is there)
        if(!sessionActive && ws && ws.readyState === 1 && !sid){
            sessionActive = true;
            personPresent = true;
            send({type: 'start_session', match_status: 'no_match'});
            setS('thinking');
        }
    }
}

function detectPerson(){
    const v = document.getElementById('vid');
    if(!v.videoWidth || !systemReady) return;
    
    // Don't keep identifying if session is already active
    if(sessionActive) {
        // Just check if face is still there (simple check)
        const c = document.createElement('canvas');
        c.width = 160; c.height = 120;
        c.getContext('2d').drawImage(v, 0, 0, 160, 120);
        const imgData = c.getContext('2d').getImageData(0, 0, 160, 120);
        let detail = 0;
        for(let i = 0; i < imgData.data.length - 4; i += 16){ detail += Math.abs(imgData.data[i] - imgData.data[i+4]); }
        detail = detail / (imgData.data.length / 16);
        if(detail < 3){
            personGoneCount++;
            if(personGoneCount > 10 && !speaking && !listening){
                personPresent = false;
                sessionActive = false;
                window._faceRegistered = false;
                console.log('👤 Person LEFT.');
                document.getElementById('rT').textContent = '';
                setS('');
                stopRec();
                speechSynthesis.cancel();
                speaking = false;
                if(sid){ send({type: 'end_session', session_id: sid}); sid = null; }
            }
        } else {
            personGoneCount = 0;
        }
        return;
    }
    
    // Session not active - identify face
    if(window._identifying) return; // Prevent overlapping calls
    window._identifying = true;
    
    const c = document.createElement('canvas');
    c.width = 320; c.height = 240;
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, 320, 240);
    const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
    
    fetch('/api/face/identify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image: imageData})
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
        window._identifying = false;
        if(sessionActive) return; // Double-check: session may have started while waiting
        if(data.found && data.name){
            // KNOWN FACE!
            personPresent = true;
            sessionActive = true;
            personGoneCount = 0;
            console.log('🔄 RECOGNIZED:', data.name, 'confidence:', data.confidence);
            if(ws && ws.readyState === 1){
                send({type: 'start_session', match_status: 'match_found', person_name: data.name, visit_count: data.visit_count || 1});
                setS('thinking');
            }
        } else if(!data.no_face && !data.found){
            // NEW FACE
            personPresent = true;
            sessionActive = true;
            personGoneCount = 0;
            console.log('👤 NEW FACE - asking name');
            window._lastFaceImage = imageData;
            if(ws && ws.readyState === 1){
                send({type: 'start_session', match_status: 'no_match'});
                setS('thinking');
            }
        }
        // If no_face, do nothing (waiting for person)
    })
    .catch(function(){ window._identifying = false; });
}

// ===== FULLY AUTOMATIC SYSTEM - NO HUMAN INTERACTION NEEDED =====
speechSynthesis.getVoices();
if(window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = ()=> speechSynthesis.getVoices();
}

// Connect WebSocket immediately
conn();

// Auto-activate on ANY user interaction (mousemove, keydown, touch, click)
let activated = false;
function activate(){
    if(activated) return;
    activated = true;
    // Enable audio
    const w = new SpeechSynthesisUtterance('');
    speechSynthesis.speak(w);
    // Start camera + detection
    startSystem();
    // Remove all listeners
    document.removeEventListener('click', activate);
    document.removeEventListener('mousemove', activate);
    document.removeEventListener('keydown', activate);
    document.removeEventListener('touchstart', activate);
}
document.addEventListener('click', activate);
document.addEventListener('mousemove', activate);
document.addEventListener('keydown', activate);
document.addEventListener('touchstart', activate);

// Keepalive
setInterval(()=>{if(ws&&ws.readyState===1)send({type:'ping'});},25000);
</script>
</body>
</html>
